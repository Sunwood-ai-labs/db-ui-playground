version: '3.8'

services:
  # PostgreSQL データベース
  postgres:
    image: postgres:15
    container_name: db-ui-postgres
    environment:
      POSTGRES_DB: sampledb
      POSTGRES_USER: dbuser
      POSTGRES_PASSWORD: dbpassword
    ports:
      - "${POSTGRES_PORT_HOST:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dbuser -d sampledb"]
      interval: 10s
      timeout: 5s
      retries: 5

  # db-ui アプリケーション
  db-ui:
    image: ghcr.io/n7olkachev/db-ui:latest
    container_name: db-ui-app
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_USER: dbuser
      POSTGRES_PASSWORD: dbpassword
      POSTGRES_DB: sampledb
      POSTGRES_PORT: 5432
      # Groq API キーが必要な場合は以下のコメントを外して設定してください
      GROQ_API_KEY: ${GROQ_API_KEY}
      GROQ_MODEL: ${GROQ_MODEL}
    ports:
      - "${DB_UI_PORT_HOST:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data: